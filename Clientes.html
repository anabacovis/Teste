<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clientes — Agência OS</title>
<link rel="stylesheet" href="assets/app.css" />
<style>
  /* resumo */
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .scard { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r); box-shadow:var(--shadow); padding:16px 18px; display:flex; align-items:center; gap:14px; }
  .scard .ico { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; flex-shrink:0; }
  .scard .ico svg { width:20px; height:20px; }
  .scard .n { font-size:23px; font-weight:800; line-height:1; color:var(--ink); }
  .scard .l { font-size:12.5px; font-weight:600; color:var(--muted); margin-top:4px; }

  /* toolbar */
  .tb { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search { position:relative; flex:1; min-width:200px; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }
  .search input { width:100%; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:11px 14px 11px 42px; font-family:inherit; font-size:14px; font-weight:500; color:var(--ink); box-shadow:var(--shadow); }
  .search input:focus { outline:none; border-color:var(--primary); }
  .sel { position:relative; display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); }
  .sel select { appearance:none; border:none; background:none; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft); padding:11px 32px 11px 13px; border-radius:11px; cursor:pointer; }
  .sel select:focus { outline:none; }
  .sel::after { content:''; position:absolute; right:13px; top:50%; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-65%) rotate(45deg); pointer-events:none; }

  /* grid de clientes */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .ccard { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:20px 22px; transition:box-shadow .15s; }
  .ccard:hover { box-shadow:var(--shadow-lg); }
  .ccard.inativo { opacity:.72; }
  .ccard-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .clogo { width:50px; height:50px; border-radius:14px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:17px; flex-shrink:0; }
  .ccard-id { flex:1; min-width:0; }
  .ccard-id h3 { margin:0 0 7px; font-size:18px; font-weight:800; color:var(--ink); }
  .ccard-resp { display:flex; align-items:center; gap:10px; }
  .ccard-resp .resp { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .resp-av { width:22px; height:22px; border-radius:7px; display:grid; place-items:center; color:#fff; font-size:10.5px; font-weight:700; }
  .edit-btn { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-family:inherit; font-size:13px; font-weight:700; padding:9px 14px; border-radius:10px; cursor:pointer; flex-shrink:0; }
  .edit-btn svg { width:15px; height:15px; }
  .edit-btn:hover { background:var(--surface-2); border-color:#d4d2fb; color:var(--primary); }

  .ccard-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .metric { background:var(--surface-2); border:1px solid var(--border-2); border-radius:13px; padding:12px 14px; }
  .metric .mk { font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  .metric .mv { font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.3px; }
  .metric .mv small { font-size:12px; font-weight:600; color:var(--muted); }

  .ccard-block { margin-bottom:16px; }
  .bk-label { font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { background:var(--violet-bg); color:var(--violet); font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:8px; }

  /* módulos / toggles */
  .modules { display:flex; flex-direction:column; gap:8px; }
  .tgl { display:flex; align-items:center; gap:11px; width:100%; border:1px solid var(--border-2); background:var(--surface); border-radius:12px; padding:10px 13px; cursor:pointer; font-family:inherit; transition:background .12s,border-color .12s; }
  .tgl-ico { width:30px; height:30px; border-radius:9px; background:var(--gray-bg); color:var(--muted); display:grid; place-items:center; flex-shrink:0; transition:all .15s; }
  .tgl-ico svg { width:16px; height:16px; }
  .tgl-label { flex:1; text-align:left; font-size:13.5px; font-weight:700; color:var(--ink-soft); }
  .tgl.on { background:color-mix(in srgb, var(--primary) 7%, #fff); border-color:color-mix(in srgb, var(--primary) 24%, #fff); }
  .tgl.on .tgl-ico { background:var(--grad); color:#fff; }
  .tgl.on .tgl-label { color:var(--ink); }
  .switch { width:38px; height:22px; border-radius:20px; background:#d7dbe6; position:relative; flex-shrink:0; transition:background .18s; }
  .knob { position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .18s; }
  .tgl.on .switch { background:var(--primary); }
  .tgl.on .knob { left:19px; }
  .tgl.locked { cursor:not-allowed; background:var(--surface-2); }
  .tgl.locked .tgl-label { color:var(--muted-2); }
  .tgl-lock { color:var(--muted-2); flex-shrink:0; }
  .tgl-lock svg { width:17px; height:17px; }

  .ccard-foot { border-top:1px solid var(--border-2); padding-top:15px; }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .lnk { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:9px; cursor:pointer; }
  .lnk svg { width:14px; height:14px; color:var(--muted); }
  .lnk:hover { background:var(--surface-2); border-color:#d4d2fb; color:var(--primary); }
  .lnk:hover svg { color:var(--primary); }
  .obs { display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--surface-2); border-radius:10px; padding:10px 12px; }
  .obs svg { width:15px; height:15px; color:var(--amber); flex-shrink:0; margin-top:1px; }

  .empty { grid-column:1/-1; text-align:center; color:var(--muted); font-weight:600; padding:50px 0; }
  .gridfoot { margin-top:16px; color:var(--muted); font-size:13px; font-weight:600; }
  .gridfoot b { color:var(--ink); }

  /* ===== Tweaks: densidade ===== */
  @media (min-width:1081px){
    [data-density="compacto"] .grid { grid-template-columns:repeat(3,1fr); }
    [data-density="galeria"]  .grid { grid-template-columns:repeat(auto-fill,minmax(234px,1fr)); }
  }
  [data-density="compacto"] .ccard { padding:16px 17px; }
  [data-density="compacto"] .clogo { width:42px; height:42px; font-size:15px; }
  [data-density="compacto"] .ccard-metrics { gap:8px; margin-bottom:14px; }
  [data-density="compacto"] .metric { padding:9px 11px; }
  [data-density="compacto"] .metric .mv { font-size:15px; }
  [data-density="compacto"] .obs { display:none; }
  [data-density="galeria"] .ccard { padding:16px 17px; }
  [data-density="galeria"] .ccard-block, [data-density="galeria"] .ccard-foot { display:none; }
  [data-density="galeria"] .ccard-metrics { grid-template-columns:1fr; gap:7px; margin-bottom:0; }
  [data-density="galeria"] .ccard-head { margin-bottom:14px; }

  /* ===== Tweaks: estilo dos cards ===== */
  [data-cardstyle="plano"] .ccard { box-shadow:none; border-color:var(--border); }
  [data-cardstyle="plano"] .ccard:hover { box-shadow:var(--shadow); }
  [data-cardstyle="plano"] .metric { background:#fff; }
  [data-cardstyle="editorial"] .ccard { border-top:4px solid var(--primary); border-radius:7px 7px var(--r-lg) var(--r-lg); }
  [data-cardstyle="editorial"] .ccard-id h3 { font-size:20px; letter-spacing:-.4px; }

  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:13px 20px; border-radius:13px; font-size:14px; font-weight:700; box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:100; display:flex; align-items:center; gap:10px; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg { width:18px; height:18px; color:#4be08a; }

  @media (max-width:1080px){ .grid { grid-template-columns:1fr; } }
  @media (max-width:760px){ .summary { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .ccard-metrics { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js" data-guard></script>
</head>
<body>
<div class="app">
  <div id="sidebar" data-active="clientes"></div>
  <div id="scrim" class="scrim" onclick="toggleSidebar()"></div>

  <main class="main">
    <div class="mobile-top">
      <button onclick="toggleSidebar()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <span class="mt-brand">Clientes</span><span style="width:40px"></span>
    </div>

    <header class="topbar">
      <div>
        <h2>Clientes</h2>
        <p class="sub">Cadastro e controle operacional de cada cliente da agência.</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot">3</span></button>
        <button class="btn btn-primary" id="btnAddClient"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar cliente</button>
      </div>
    </header>

    <!-- RESUMO -->
    <section class="summary">
      <div class="scard"><span class="ico" style="background:var(--tile-purple)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><div><div class="n" id="sTotal">0</div><div class="l">Clientes no total</div></div></div>
      <div class="scard"><span class="ico" style="background:var(--tile-green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span><div><div class="n" id="sAtivos" style="color:var(--green)">0</div><div class="l">Ativos</div></div></div>
      <div class="scard"><span class="ico" style="background:var(--tile-blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span><div><div class="n" id="sMrr">—</div><div class="l">Receita recorrente / mês</div></div></div>
      <div class="scard"><span class="ico" style="background:var(--tile-orange)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></span><div><div class="n" id="sMeta">0</div><div class="l">Meta de entregas / mês</div></div></div>
    </section>

    <!-- TOOLBAR -->
    <div class="tb">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="text" placeholder="Buscar cliente…" /></div>
      <div class="sel"><select id="fStatus"><option value="">Todos os status</option><option value="ativo">Ativos</option><option value="inativo">Inativos</option></select></div>
      <div class="sel"><select id="fResp"><option value="">Todos os responsáveis</option><option value="ana">Ana</option><option value="nicole">Nicole</option></select></div>
    </div>

    <!-- GRID -->
    <section class="grid" id="grid"></section>
    <div class="gridfoot">Mostrando <b id="count">0</b> clientes</div>
  </main>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg><span id="toast-msg"></span></div>

<script src="assets/sidebar.js"></script>
<script src="assets/data.js"></script>
<script src="assets/clientes-modal.js"></script>
<script src="assets/clientes.js"></script>
</body>
</html>
