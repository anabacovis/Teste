<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendário — Connect OS</title>
<link rel="stylesheet" href="assets/app.css" />
<style>
  /* toolbar */
  .tb { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; box-shadow:var(--shadow); }
  .vbtn { display:inline-flex; align-items:center; gap:7px; border:none; background:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--muted); padding:8px 16px; border-radius:9px; }
  .vbtn.on { background:var(--grad); color:#fff; box-shadow:0 6px 14px rgba(108,99,255,.3); }
  .period { font-size:16px; font-weight:800; color:var(--ink); }
  .tb .spacer { flex:1; }
  .sel { position:relative; display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); }
  .sel select { appearance:none; border:none; background:none; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); padding:10px 30px 10px 12px; border-radius:11px; cursor:pointer; }
  .sel select:focus { outline:none; }
  .sel::after { content:''; position:absolute; right:12px; top:50%; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-65%) rotate(45deg); pointer-events:none; }

  /* legenda */
  .legend { display:flex; align-items:center; gap:18px; margin-bottom:16px; flex-wrap:wrap; font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .legend .lg { display:inline-flex; align-items:center; gap:7px; }
  .legend .ld { width:11px; height:11px; border-radius:4px; }

  /* ===== MÊS ===== */
  .month { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .wd-head { display:grid; grid-template-columns:repeat(7,1fr); background:var(--surface-2); border-bottom:1px solid var(--border); }
  .wd-head span { padding:11px 12px; font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); text-align:left; }
  .grid-m { display:grid; grid-template-columns:repeat(7,1fr); }
  .cell { min-height:118px; border-right:1px solid var(--border-2); border-bottom:1px solid var(--border-2); padding:8px; display:flex; flex-direction:column; gap:5px; }
  .cell:nth-child(7n) { border-right:none; }
  .cell.empty { background:var(--surface-2); }
  .cell.weekend { background:#fcfcfe; }
  .cell.today { background:#f6f5ff; }
  .cell.has-late { box-shadow:inset 3px 0 0 var(--red); }
  .cell-h { display:flex; align-items:center; justify-content:space-between; }
  .cd { font-size:13px; font-weight:800; color:var(--ink-soft); }
  .cell.today .cd { background:var(--grad); color:#fff; width:24px; height:24px; border-radius:8px; display:grid; place-items:center; }
  .td-tag { font-size:10px; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:.4px; }
  .cell-evs { display:flex; flex-direction:column; gap:4px; }
  .ev { display:flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--border-2); border-left:3px solid var(--gray); border-radius:7px; padding:3px 6px; cursor:pointer; font-family:inherit; width:100%; }
  .ev:hover { background:var(--surface-2); }
  .ev.late { background:#fef7f6; }
  .ev-logo { width:16px; height:16px; border-radius:5px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:8px; flex-shrink:0; }
  .ev-logo.sm { width:20px; height:20px; border-radius:6px; font-size:9px; }
  .ev-type { font-size:11px; font-weight:700; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; text-align:left; }
  .ev-flame { color:var(--red); display:inline-flex; }
  .ev-av { width:16px; height:16px; border-radius:5px; display:grid; place-items:center; color:#fff; font-size:9px; font-weight:700; flex-shrink:0; }
  .more { border:none; background:none; font-family:inherit; font-size:11px; font-weight:700; color:var(--primary); cursor:pointer; text-align:left; padding:1px 4px; }

  /* ===== SEMANA ===== */
  .week { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .wcol { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; min-height:300px; }
  .wcol.today { border-color:#d4d2fb; }
  .wcol-h { display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 8px; border-bottom:1px solid var(--border-2); background:var(--surface-2); }
  .wcol.today .wcol-h { background:#f6f5ff; }
  .wcol.weekend .wcol-h { background:#fcfcfe; }
  .ww { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .wd-n { font-size:18px; font-weight:800; color:var(--ink); }
  .wd-n.on { background:var(--grad); color:#fff; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; }
  .wcol-b { padding:9px; display:flex; flex-direction:column; gap:8px; }
  .w-empty { text-align:center; color:var(--muted-2); font-size:12px; font-weight:700; padding:14px 0; }
  .wev { display:flex; flex-direction:column; gap:6px; background:#fff; border:1px solid var(--border-2); border-left:3px solid var(--gray); border-radius:10px; padding:9px 10px; cursor:pointer; font-family:inherit; text-align:left; }
  .wev:hover { box-shadow:var(--shadow); }
  .wev.late { background:#fef7f6; }
  .wev-top { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800; color:var(--ink); }
  .wev-title { font-size:12.5px; font-weight:700; color:var(--ink-soft); line-height:1.3; }
  .wev-foot { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  /* ===== HOJE ===== */
  .today { max-width:780px; }
  .today-alert { display:flex; align-items:center; gap:10px; background:var(--red-bg); color:var(--red); border-radius:13px; padding:13px 16px; font-size:13.5px; font-weight:600; margin-bottom:18px; }
  .today-alert svg { width:18px; height:18px; flex-shrink:0; }
  .today-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .today-head h3 { margin:0; font-size:19px; font-weight:800; color:var(--ink); }
  .today-head span { font-size:13.5px; font-weight:600; color:var(--muted); }
  .today-list { display:flex; flex-direction:column; gap:12px; }
  .titem { display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r); box-shadow:var(--shadow); padding:15px 17px; cursor:pointer; font-family:inherit; text-align:left; }
  .titem:hover { box-shadow:var(--shadow-lg); }
  .clogo { width:46px; height:46px; border-radius:13px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; flex-shrink:0; }
  .clogo.lg { width:52px; height:52px; font-size:17px; }
  .ti-main { flex:1; min-width:0; }
  .ti-tags { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .ti-title { font-size:15.5px; font-weight:800; color:var(--ink); }
  .ti-sub { font-weight:600; color:var(--muted); }
  .ti-meta { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); font-weight:600; margin-top:5px; }
  .ti-meta b { color:var(--ink); }
  .ev-av { display:grid; }
  .dotsep { width:3px; height:3px; border-radius:50%; background:var(--muted-2); }
  .empty { text-align:center; color:var(--muted); font-weight:600; padding:40px 0; }

  /* drawer */
  .drawer-scrim { position:fixed; inset:0; background:rgba(9,13,24,.45); opacity:0; pointer-events:none; transition:opacity .2s; z-index:90; }
  .drawer-scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw; background:#fff; box-shadow:-10px 0 40px rgba(15,23,41,.18); transform:translateX(100%); transition:transform .25s ease; z-index:95; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .dw-head { display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--border); }
  .dw-head h3 { margin:0; font-size:16px; font-weight:800; color:var(--ink); }
  .dw-close { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:grid; place-items:center; color:var(--ink-soft); }
  .dw-close svg { width:18px; height:18px; }
  .dw-body { padding:22px; overflow-y:auto; }
  .dw-hero { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .dw-hero h3 { margin:0; font-size:17px; font-weight:800; color:var(--ink); }
  .dw-hero small { color:var(--muted); font-weight:600; }
  .dw-rows { display:flex; flex-direction:column; }
  .dwr { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-2); font-size:14px; }
  .dwr span { color:var(--muted); font-weight:600; }
  .dwr b { color:var(--ink); font-weight:800; } .dwr b.late { color:var(--red); }
  .dw-cta { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:20px; background:var(--grad); color:#fff; text-decoration:none; font-weight:700; font-size:14px; padding:13px; border-radius:13px; box-shadow:0 8px 20px rgba(108,99,255,.32); }
  .dw-cta svg { width:18px; height:18px; }
  .dw-day { display:flex; flex-direction:column; gap:10px; }
  .dw-day .titem { box-shadow:none; }

  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:13px 20px; border-radius:13px; font-size:14px; font-weight:700; box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:100; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:980px){
    .week { grid-template-columns:repeat(3,1fr); }
    .cell { min-height:96px; }
    .ev-type { display:none; }
  }
  @media (max-width:680px){
    .grid-m { font-size:11px; }
    .cell { min-height:74px; padding:5px; }
    .ev-av, .td-tag { display:none; }
    .week { grid-template-columns:1fr 1fr; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js" data-guard></script>
</head>
<body>
<div class="app">
  <div id="sidebar" data-active="calendario"></div>
  <div id="scrim" class="scrim" onclick="toggleSidebar()"></div>

  <main class="main">
    <div class="mobile-top">
      <button onclick="toggleSidebar()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <span class="mt-brand">Calendário</span><span style="width:40px"></span>
    </div>

    <header class="topbar">
      <div>
        <h2>Calendário</h2>
        <p class="sub">Entregas por data — leitura rápida, sem poluição.</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot">3</span></button>
        <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Nova Demanda</button>
      </div>
    </header>

    <!-- toolbar -->
    <div class="tb">
      <div class="seg">
        <button class="vbtn on" data-v="mes" onclick="setView('mes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Mês</button>
        <button class="vbtn" data-v="semana" onclick="setView('semana')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 4v16"/></svg>Semana</button>
        <button class="vbtn" data-v="hoje" onclick="setView('hoje')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>Hoje</button>
      </div>
      <span class="period" id="periodLabel">Maio 2025</span>
      <span class="spacer"></span>
      <div class="sel"><select id="fClient"><option value="">Cliente</option><option value="brasa">Brasa Meat</option><option value="casa">Casa de Pedra</option><option value="igreja">Igreja</option><option value="lcs">LCS</option><option value="trinitas">Trinitas</option><option value="unique">Unique</option><option value="outdoors">Outofdoors Travel</option><option value="vinicius">Vinicius Cortázio</option></select></div>
      <div class="sel"><select id="fResp"><option value="">Equipe</option><option value="ana">Ana</option><option value="nicole">Nicole</option></select></div>
      <div class="sel"><select id="fStatus"><option value="">Status</option><option value="briefing">Briefing</option><option value="producao">Produção</option><option value="aprovacao">Aprovação</option><option value="correcao">Correção</option><option value="agendado">Agendado</option><option value="publicado">Publicado</option></select></div>
      <div class="sel"><select id="fTipo"><option value="">Tipo</option><option value="estatico">Estático</option><option value="carrossel">Carrossel</option><option value="reels">Reels</option><option value="story">Story</option><option value="yt">YouTube</option><option value="short">Short</option><option value="news">News</option><option value="demanda">Sob demanda</option></select></div>
    </div>

    <!-- legenda -->
    <div class="legend">
      <span class="lg"><span class="ld" style="background:var(--red)"></span>Atrasado</span>
      <span class="lg"><span class="ld" style="background:var(--primary)"></span>Hoje</span>
      <span class="lg"><span class="ld" style="background:var(--violet)"></span>Agendado</span>
      <span class="lg"><span class="ld" style="background:var(--blue)"></span>Em produção</span>
      <span class="lg"><span class="ld" style="background:var(--amber)"></span>Aprovação</span>
      <span class="lg"><span class="ld" style="background:var(--green)"></span>Publicado</span>
    </div>

    <div id="cal" class="cal-view view-mes"></div>
  </main>
</div>

<!-- drawer -->
<div class="drawer-scrim" id="drawerScrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dw-head"><h3 id="dwTitle">Detalhe</h3><button class="dw-close" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="dw-body" id="dwBody"></div>
</aside>

<div class="toast" id="toast"><span id="toast-msg"></span></div>

<script src="assets/sidebar.js"></script>
<script src="assets/data.js"></script>
<script src="assets/calendar.js"></script>
</body>
</html>
