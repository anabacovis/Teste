<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arquivos — Connect OS</title>
<link rel="stylesheet" href="assets/app.css" />
<style>
  /* pastas principais (destaque) */
  .folders-h { display:flex; align-items:center; gap:9px; margin-bottom:13px; }
  .folders-h h3 { margin:0; font-size:14px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:.4px; }
  .folders-h svg { width:17px; height:17px; color:var(--violet); }
  .folders { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; }
  .folder { display:flex; align-items:center; gap:12px; padding:14px 15px; border:1px solid var(--border-2); background:var(--surface); border-radius:14px; box-shadow:var(--shadow); cursor:pointer; font-family:inherit; text-align:left; transition:box-shadow .15s, border-color .15s; }
  .folder:hover { box-shadow:var(--shadow-lg); border-color:#d4d2fb; }
  .f-logo { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px; flex-shrink:0; }
  .f-info { flex:1; min-width:0; }
  .f-info b { display:block; font-size:14px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .f-info small { font-size:12px; color:var(--muted); font-weight:600; }
  .f-arrow { width:17px; height:17px; color:var(--muted-2); flex-shrink:0; }
  .folder:hover .f-arrow { color:var(--primary); }

  /* toolbar */
  .tb { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .search { position:relative; flex:1; min-width:200px; }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }
  .search input { width:100%; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:11px 14px 11px 42px; font-family:inherit; font-size:14px; font-weight:500; color:var(--ink); box-shadow:var(--shadow); }
  .search input:focus { outline:none; border-color:var(--primary); }
  .sel { position:relative; display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:var(--shadow); }
  .sel select { appearance:none; border:none; background:none; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft); padding:11px 32px 11px 13px; border-radius:11px; cursor:pointer; }
  .sel select:focus { outline:none; }
  .sel::after { content:''; position:absolute; right:13px; top:50%; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-65%) rotate(45deg); pointer-events:none; }

  /* tabela */
  .table-scroll { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:auto; }
  table.files { width:100%; border-collapse:collapse; min-width:920px; }
  @media (max-width:760px){ table.files { min-width:0 !important; } }
  table.files thead th { position:sticky; top:0; background:var(--surface); text-align:left; font-size:11.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); padding:15px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.files td { padding:12px 14px; border-bottom:1px solid var(--border-2); font-size:13.5px; vertical-align:middle; }
  table.files tbody tr:last-child td { border-bottom:none; }
  table.files tbody tr:hover { background:var(--surface-2); }
  .c-accent { width:4px; padding:0 !important; background:transparent; }
  tr.principal { background:#fbfaff; } tr.principal .c-accent { background:var(--violet); }
  tr.principal:hover { background:var(--surface-2); }
  .cell-client { display:inline-flex; align-items:center; gap:10px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .mlogo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:11px; flex-shrink:0; }
  .c-nome { display:flex; align-items:center; gap:11px; }
  .c-nome b { font-weight:700; color:var(--ink); }
  .t-ico { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; flex-shrink:0; }
  .t-ico svg { width:16px; height:16px; }
  .t-ico.st-violet { background:var(--violet-bg); color:var(--violet); }
  .t-ico.st-blue { background:var(--blue-bg); color:var(--blue); }
  .t-ico.st-amber { background:var(--amber-bg); color:var(--amber); }
  .t-ico.st-green { background:var(--green-bg); color:var(--green); }
  .t-ico.st-gray { background:var(--gray-bg); color:var(--gray); }
  .t-ico.st-coral { background:#fdeee6; color:#d24f2a; }
  .upd { font-weight:700; color:var(--ink-soft); }
  .cell-resp { display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  .mav { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; flex-shrink:0; }
  .obs { font-size:12.5px; color:var(--ink-soft); font-weight:600; max-width:200px; } .muted { color:var(--muted-2); }
  .tac { text-align:center; }
  .open-btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:10px; cursor:pointer; white-space:nowrap; }
  .open-btn svg { width:14px; height:14px; }
  .open-btn:hover { background:var(--surface-2); border-color:#d4d2fb; color:var(--primary); }
  .t-empty { text-align:center; color:var(--muted); font-weight:600; padding:38px 0; }
  .tfoot { display:flex; align-items:center; justify-content:space-between; padding:13px 4px 0; color:var(--muted); font-size:13px; font-weight:600; }
  .tfoot b { color:var(--ink); }

  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:13px 20px; border-radius:13px; font-size:14px; font-weight:700; box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:100; display:flex; align-items:center; gap:10px; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg { width:18px; height:18px; color:#4be08a; }

  @media (max-width:1100px){ .folders { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .folders { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/auth.js" data-guard></script>
</head>
<body>
<div class="app">
  <div id="sidebar" data-active="arquivos"></div>
  <div id="scrim" class="scrim" onclick="toggleSidebar()"></div>

  <main class="main">
    <div class="mobile-top">
      <button onclick="toggleSidebar()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <span class="mt-brand">Arquivos</span><span style="width:40px"></span>
    </div>

    <header class="topbar">
      <div>
        <h2>Arquivos / Links do Drive</h2>
        <p class="sub">Central organizada de materiais e links por cliente e por entrega.</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot">3</span></button>
        <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Novo link</button>
      </div>
    </header>

    <!-- PASTAS PRINCIPAIS -->
    <div class="folders-h">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></svg>
      <h3>Pastas principais</h3>
    </div>
    <div class="folders" id="folders"></div>

    <!-- TOOLBAR -->
    <div class="tb">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="text" placeholder="Buscar material ou link…" /></div>
      <div class="sel"><select id="fClient"><option value="">Todos os clientes</option><option value="brasa">Brasa Meat</option><option value="casa">Casa de Pedra</option><option value="igreja">Igreja</option><option value="lcs">LCS</option><option value="trinitas">Trinitas</option><option value="unique">Unique</option><option value="outdoors">Outofdoors Travel</option><option value="vinicius">Vinicius Cortázio</option></select></div>
      <div class="sel"><select id="fTipo"><option value="">Todos os tipos</option><option value="pasta">Pasta do cliente</option><option value="identidade">Identidade visual</option><option value="editavel">Arquivo editável</option><option value="final">Arquivo final</option><option value="referencia">Referência</option><option value="briefing">Briefing</option><option value="recorrente">Material recorrente</option><option value="externo">Link externo</option></select></div>
    </div>

    <!-- TABELA -->
    <div class="table-scroll">
      <table class="files">
        <thead><tr>
          <th class="c-accent"></th>
          <th>Cliente</th><th>Material</th><th>Tipo</th><th>Atualização</th><th>Responsável</th><th>Observação</th><th class="tac">Link</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="tfoot"><span>Mostrando <b id="count">0</b> links</span><span>Atualizado em 22/05/2025</span></div>
  </main>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg><span id="toast-msg"></span></div>

<script src="assets/sidebar.js"></script>
<script src="assets/data.js"></script>
<script src="assets/arquivos.js"></script>
</body>
</html>
